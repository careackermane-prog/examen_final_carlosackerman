
services:
  db:
    image: postgres:16
    container_name: unicah_postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db-data16:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    image: odoo:20.0
    container_name: unicah_odoo
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-data:/var/lib/odoo
      - ./tienda_unicah:/mnt/extra-addons/tienda_unicah
    restart: unless-stopped

volumes:
  db-data16:
    name: examen_final_db-data16
  odoo-data:
    name: examen_final_odoo-data
